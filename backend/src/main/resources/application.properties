spring.application.name=backend
# Portul pe care va rula serverul
server.port=8080

# Conexiunea MySQL
#spring.datasource.url=jdbc:mysql://localhost:3307/socialapp?serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurari Hibernate (creeaza/actualizeaza tabelele automat pe baza claselor Java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true




# Setari pentru trimiterea emailurilor (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Gmail SMTP
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}


# Cloudinary
cloudinary.url=${CLOUDINARY_URL}
